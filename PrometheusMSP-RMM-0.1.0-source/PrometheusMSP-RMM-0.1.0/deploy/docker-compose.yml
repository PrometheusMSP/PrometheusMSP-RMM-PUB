name: prometheus-rmm
services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prometheus_rmm}
      POSTGRES_USER: ${POSTGRES_USER:-prometheus_rmm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../control-plane/migrations/000001_initial.sql:/docker-entrypoint-initdb.d/000001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  control-plane:
    build:
      context: ..
      dockerfile: deploy/control-plane.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-prometheus_rmm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prometheus_rmm}?sslmode=disable
      LISTEN_ADDRESS: :8443
      HEALTH_LISTEN_ADDRESS: 127.0.0.1:8080
    secrets:
      - ca_cert
      - ca_key
      - server_cert
      - server_key
      - job_signing_private_key
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/control-plane", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

secrets:
  ca_cert:
    file: ./pki/ca.crt
  ca_key:
    file: ./pki/ca.key
  server_cert:
    file: ./pki/server.crt
  server_key:
    file: ./pki/server.key
  job_signing_private_key:
    file: ./pki/job-signing-private.pem

networks:
  backend:
    internal: false

volumes:
  postgres-data:
